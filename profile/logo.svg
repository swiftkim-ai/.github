<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="swiftkim-ai: a small swift bird">
  <!-- warm paper background -->
  <rect width="512" height="512" rx="112" fill="#FFF3DC"/>
  <g transform="translate(4 -46)">
    <!-- forked tail, the mark of a swift -->
    <path d="M150 300 L58 250 L112 318 L52 356 L158 346 Z" fill="#14696B"/>
    <!-- body -->
    <ellipse cx="262" cy="292" rx="138" ry="126" fill="#1E8E8C"/>
    <!-- belly -->
    <ellipse cx="286" cy="330" rx="88" ry="74" fill="#F4FBF8"/>
    <!-- swept-back wing -->
    <path d="M196 262 C238 226 310 240 318 300 C276 300 232 318 176 352 C170 318 176 284 196 262 Z" fill="#14696B"/>
    <!-- beak -->
    <path d="M392 262 L452 280 L392 300 Z" fill="#FF9F1C"/>
    <!-- cheek -->
    <circle cx="352" cy="306" r="17" fill="#FFB4A8"/>
    <!-- eye -->
    <circle cx="338" cy="254" r="27" fill="#FFFFFF"/>
    <circle cx="345" cy="256" r="15" fill="#17323A"/>
    <circle cx="351" cy="250" r="5" fill="#FFFFFF"/>
    <!-- little feet -->
    <path d="M244 414 v24 M232 438 h24 M300 414 v24 M288 438 h24" stroke="#FF9F1C" stroke-width="9" stroke-linecap="round" fill="none"/>
  </g>
</svg>
